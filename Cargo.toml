[package]
name = "ely-tea-party"
version = "0.3.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "A terminal for coding agents, on GPUI and Ely; a fork of Ely Tea Party."
publish = false

[dependencies]
alacritty_terminal = { version = "=0.26.0", default-features = false }
anyhow = "1"
dirs = "7"
ely-gpui-component = { git = "https://git.zacharyzhang.com/ZacharyZhang-NY/Ely-GPUI-Components.git", rev = "cdc5ce8247b58a876ffed9626953c3cb490a67ed" }
env_logger = "0.11"
futures = "0.3"
gethostname = "1.1.0"
image = { version = "0.25", default-features = false, features = ["webp"] }
gpui = { package = "gpui-pre", version = "=0.3.8", default-features = false }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.8", features = ["font-kit", "wayland", "x11"] }
log = "0.4"
polling = "3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
serde_path_to_error = "0.1.20"

[build-dependencies]
embed-resource = "3"

[dev-dependencies]
resvg = { version = "0.46", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
rustix-openpty = "0.2"
signal-hook = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
raw-window-handle = "0.6"
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
x11rb = "0.13"

[target.'cfg(target_os = "linux")'.dev-dependencies]
wayland-protocols = { version = "0.32", features = ["server", "staging"] }
wayland-server = "0.31"

[target.'cfg(target_os = "macos")'.dependencies]
block = "0.1"
objc = "0.2"
raw-window-handle = "0.6"
unicode-normalization = "0.1"

[target.'cfg(target_os = "macos")'.dev-dependencies]
core-graphics = { version = "0.24", features = ["highsierra"] }
foreign-types = "0.5"
image = { version = "0.25", default-features = false, features = ["png"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }

[lints.clippy]
all = { level = "warn", priority = -1 }

[[test]]
name = "fonts"
harness = false

# The characters' art decodes at first sight; unoptimized, a pose takes a visible moment.
[profile.dev.package.image]
opt-level = 3

[profile.dev.package.image-webp]
opt-level = 3
