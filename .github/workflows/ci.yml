name: CI

# GitHub's runners check Linux and Windows; macOS is checked, built and signed on the owner's Mac.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    # Debuginfo makes the Linux link outgrow its VM's memory.
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
      - run: npm --prefix butler ci --ignore-scripts --no-audit --no-fund
      - run: npm --prefix butler test
      - run: npm --prefix butler run build
      - run: npm --prefix butler run smoke
      # pwsh comes with the image; zsh and fish run the shell tests, Xvfb the X11 one.
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libwayland-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libx11-xcb-dev libfontconfig-dev \
            libfreetype-dev zsh fish xvfb
          # The image's group-writable zsh folders stop compinit at a prompt.
          zsh -c 'autoload -U compaudit; compaudit' | xargs -r sudo chmod g-w,o-w
      - run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@v2
      # snapd's fish script adds its folder to XDG_DATA_DIRS unless it is there already.
      - if: runner.os == 'Linux'
        env:
          XDG_DATA_DIRS: /usr/local/share:/usr/share:/var/lib/snapd/desktop
        run: scripts/check.sh
      - if: runner.os != 'Linux'
        run: cargo test --locked --quiet
      - run: cargo build --locked
