name: Release

# The Linux tarball and Windows zip onto this version's draft; the owner's Mac adds the signed disk image.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install --no-self-update
      - run: scripts/release-asset.sh --draft

  build:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install --no-self-update
      - if: runner.os == 'Linux'
        run: scripts/linux-tar.sh
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/windows-zip.ps1
      - shell: bash
        run: |
          for file in target/release/ely-tea-party-*.tar.gz target/release/ely-tea-party-*.zip; do
            if [ -f "$file" ]; then scripts/release-asset.sh "$file"; fi
          done
