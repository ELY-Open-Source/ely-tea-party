name: Release

# This version's draft, with the Linux tarball, the Windows zip and the signed, notarized disk image.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
      - run: rustup toolchain install --no-self-update
      - run: scripts/release-asset.sh --draft

  build:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
      - run: rustup toolchain install --no-self-update
      - if: runner.os == 'Linux'
        run: scripts/linux-tar.sh
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/windows-zip.ps1
      - shell: bash
        run: |
          for file in target/release/ely-tea-party-*.tar.gz target/release/ely-tea-party-*.zip; do
            if [ -f "$file" ]; then scripts/release-asset.sh "$file"; fi
          done

  macos:
    needs: draft
    # Upstream's signing Mac, which upstream lends: its keychain holds upstream's Developer ID, and the org's secrets notarize.
    runs-on: [self-hosted, macos-signing]
    steps:
      - uses: actions/checkout@v7
      # The runner's PATH lacks the host's rustup.
      - run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
      - run: rustup toolchain install --no-self-update
      - name: Build, sign and notarize the disk image
        env:
          SIGN_IDENTITY: "Developer ID Application: Yang Zhang (9PDD8M2SMS)"
          NOTARY_KEY: ${{ runner.temp }}/notary.p8
          NOTARY_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          NOTARY_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          trap 'rm -f "$NOTARY_KEY"' EXIT
          (umask 077 && printf '%s' "$NOTARY_KEY_P8" > "$NOTARY_KEY")
          scripts/mac-app.sh
      - name: Put the disk image on the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(cargo pkgid)
          scripts/release-asset.sh "target/release/ely-tea-party-${version##*[#@]}.dmg"
